<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - Mundo JJ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/98e97fbcca.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #f8f9fa; }
        .cadastro-card {
            max-width: 480px;
            margin: 60px auto;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
            overflow: hidden;
        }
        .cadastro-header {
            background: #212529;
            color: #fff;
            padding: 28px 32px 20px;
            text-align: center;
        }
        .cadastro-header h4 { font-weight: 800; margin-bottom: 4px; }
        .cadastro-header p  { font-size: .85rem; color: #adb5bd; margin: 0; }
        .cadastro-body { padding: 32px; background: #fff; }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
        <i class="fa-solid fa-bars"></i>
        <a href="index.html">
            <img src="img/Logo.png" alt="Logo Mundo JJ" style="height:60px;"
                 onerror="this.style.display='none'">
        </a>
        <span></span>
    </div>
</header>

<!-- MENU -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <ul class="navbar-nav mx-auto gap-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="dashboard.html">📊 Dashboard</a></li>
        </ul>
    </div>
</nav>

<!-- FORMULÁRIO -->
<div class="container">
    <div class="cadastro-card">
        <div class="cadastro-header">
            <div class="mb-2"><i class="fa-solid fa-user-plus fa-2x text-danger"></i></div>
            <h4>Criar Conta</h4>
            <p>Preencha os dados para se cadastrar</p>
        </div>
        <div class="cadastro-body">

            <div id="msg-erro"    class="alert alert-danger  d-none"></div>
            <div id="msg-sucesso" class="alert alert-success d-none"></div>

            <div class="mb-3">
                <label for="nome" class="form-label fw-semibold">Nome completo</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                    <input type="text" class="form-control" id="nome" placeholder="Seu nome completo">
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="seu@email.com">
                </div>
            </div>

            <div class="mb-3">
                <label for="login" class="form-label fw-semibold">Login</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="login" placeholder="Escolha um login">
                </div>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="senha" placeholder="Escolha uma senha">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-senha">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirma-senha" class="form-label fw-semibold">Confirmar senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="confirma-senha" placeholder="Repita a senha">
                </div>
            </div>

            <button class="btn btn-danger w-100 mb-3" id="btn-cadastrar">
                <i class="fa-solid fa-user-plus me-2"></i>Criar conta
            </button>

            <p class="text-center text-muted mb-0" style="font-size:.85rem;">
                Já tem conta? <a href="login.html">Entrar</a>
            </p>

        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p class="mb-0">© 2026 Mundo JJ</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = 'http://localhost:3000';

document.getElementById('toggle-senha').addEventListener('click', () => {
    const input = document.getElementById('senha');
    const icon  = document.querySelector('#toggle-senha i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
});

document.getElementById('btn-cadastrar').addEventListener('click', async () => {
    const nome          = document.getElementById('nome').value.trim();
    const email         = document.getElementById('email').value.trim();
    const login         = document.getElementById('login').value.trim();
    const senha         = document.getElementById('senha').value.trim();
    const confirmaSenha = document.getElementById('confirma-senha').value.trim();

    const msgErro    = document.getElementById('msg-erro');
    const msgSucesso = document.getElementById('msg-sucesso');
    msgErro.classList.add('d-none');
    msgSucesso.classList.add('d-none');

    if (!nome || !email || !login || !senha || !confirmaSenha) {
        msgErro.textContent = 'Preencha todos os campos.';
        msgErro.classList.remove('d-none');
        return;
    }

    if (senha !== confirmaSenha) {
        msgErro.textContent = 'As senhas não coincidem.';
        msgErro.classList.remove('d-none');
        return;
    }

    if (senha.length < 3) {
        msgErro.textContent = 'A senha deve ter pelo menos 3 caracteres.';
        msgErro.classList.remove('d-none');
        return;
    }

    try {
        const resCheck = await fetch(`${API}/usuarios?login=${login}`);
        const existentes = await resCheck.json();
        if (existentes.length > 0) {
            msgErro.textContent = 'Este login já está em uso. Escolha outro.';
            msgErro.classList.remove('d-none');
            return;
        }

        const novoUsuario = {
            id: crypto.randomUUID(),
            login, senha, nome, email,
            admin: false
        };

        const res = await fetch(`${API}/usuarios`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(novoUsuario)
        });

        if (!res.ok) throw new Error('Erro ao cadastrar');

        msgSucesso.textContent = 'Conta criada com sucesso! Redirecionando para o login...';
        msgSucesso.classList.remove('d-none');

        setTimeout(() => { window.location.href = 'login.html'; }, 1500);

    } catch (err) {
        msgErro.textContent = 'Erro ao conectar com o servidor. Verifique se o JSON Server está rodando.';
        msgErro.classList.remove('d-none');
    }
});
</script>

</body>
</html>
