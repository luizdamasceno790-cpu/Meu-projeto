<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mundo JJ</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/98e97fbcca.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #f8f9fa; }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,.1);
            overflow: hidden;
        }
        .login-header {
            background: #212529;
            color: #fff;
            padding: 28px 32px 20px;
            text-align: center;
        }
        .login-header h4 { font-weight: 800; margin-bottom: 4px; }
        .login-header p  { font-size: .85rem; color: #adb5bd; margin: 0; }
        .login-body { padding: 32px; background: #fff; }
        .btn-danger { font-weight: 600; }
        .divider {
            text-align: center;
            color: #adb5bd;
            font-size: .8rem;
            margin: 16px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            display: inline-block;
            width: 35%;
            height: 1px;
            background: #dee2e6;
            vertical-align: middle;
            margin: 0 8px;
        }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
        <i class="fa-solid fa-bars"></i>
        <a href="index.html">
            <img src="img/Logo.png" alt="Logo Mundo JJ" style="height:60px;"
                 onerror="this.style.display='none'">
        </a>
        <span></span>
    </div>
</header>

<!-- MENU -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <ul class="navbar-nav mx-auto gap-3">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link text-danger" href="dashboard.html">📊 Dashboard</a></li>
        </ul>
    </div>
</nav>

<!-- FORMULÁRIO DE LOGIN -->
<div class="container">
    <div class="login-card">
        <div class="login-header">
            <div class="mb-2"><i class="fa-solid fa-user-lock fa-2x text-danger"></i></div>
            <h4>Entrar no Mundo JJ</h4>
            <p>Acesse sua conta para favoritar técnicas</p>
        </div>
        <div class="login-body">

            <div id="msg-erro"    class="alert alert-danger  d-none"></div>
            <div id="msg-sucesso" class="alert alert-success d-none"></div>

            <div class="mb-3">
                <label for="login" class="form-label fw-semibold">Login</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="login" placeholder="Seu login">
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label fw-semibold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="senha" placeholder="Sua senha">
                    <button class="btn btn-outline-secondary" type="button" id="toggle-senha">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button class="btn btn-danger w-100 mb-3" id="btn-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
            </button>

            <div class="divider">ou</div>

            <a href="cadastro-usuario.html" class="btn btn-outline-dark w-100">
                <i class="fa-solid fa-user-plus me-2"></i>Criar nova conta
            </a>

            <p class="text-center text-muted mt-3 mb-0" style="font-size:.8rem;">
                <strong>Admin:</strong> login: <code>admin</code> / senha: <code>123</code>
            </p>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    <p class="mb-0">© 2026 Mundo JJ</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const API = 'http://localhost:3000';

// Mostrar/ocultar senha
document.getElementById('toggle-senha').addEventListener('click', () => {
    const input = document.getElementById('senha');
    const icon  = document.querySelector('#toggle-senha i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
});

// Login
document.getElementById('btn-login').addEventListener('click', async () => {
    const login = document.getElementById('login').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const msgErro    = document.getElementById('msg-erro');
    const msgSucesso = document.getElementById('msg-sucesso');

    msgErro.classList.add('d-none');
    msgSucesso.classList.add('d-none');

    if (!login || !senha) {
        msgErro.textContent = 'Preencha login e senha.';
        msgErro.classList.remove('d-none');
        return;
    }

    try {
        const res = await fetch(`${API}/usuarios?login=${login}`);
        const usuarios = await res.json();

        if (usuarios.length === 0 || usuarios[0].senha !== senha) {
            msgErro.textContent = 'Login ou senha incorretos.';
            msgErro.classList.remove('d-none');
            return;
        }

        const usuario = usuarios[0];
        sessionStorage.setItem('usuarioLogado', JSON.stringify(usuario));

        msgSucesso.textContent = `Bem-vindo, ${usuario.nome}! Redirecionando...`;
        msgSucesso.classList.remove('d-none');

        setTimeout(() => { window.location.href = 'index.html'; }, 1200);

    } catch (err) {
        msgErro.textContent = 'Erro ao conectar com o servidor. Verifique se o JSON Server está rodando.';
        msgErro.classList.remove('d-none');
    }
});

// Enter para logar
document.getElementById('senha').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>

</body>
</html>
